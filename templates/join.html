<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Join · {{ event }}</title>
</head>
<body>
  <div class="flag"></div>
  <main class="wrap">
    <div class="hero">
      <div class="emoji">🐘</div>
      <h1>{{ event }}</h1>
      <p class="sub">Find people, team up with a พี่, show off — earn points.</p>
    </div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('join') }}">
      <label class="field">
        <span>Your name</span>
        <input class="input" name="name" value="{{ name or '' }}" maxlength="40"
               autocomplete="name" placeholder="First name + nickname" required autofocus>
      </label>
      <div class="field">
        <span>You are a…</span>
        <div class="roles">
          {% for key, label in roles.items() %}
          <label><input type="radio" name="role" value="{{ key }}" required
                        {% if role == key %}checked{% endif %}><span>{{ label }}<small class="role-hint">{{ hints[key] }}</small></span></label>
          {% endfor %}
        </div>
      </div>
      <button class="btn" type="submit">Let's go →</button>
    </form>
  </main>
</body>
</html>
