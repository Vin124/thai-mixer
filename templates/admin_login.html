<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Admin · Mixer</title>
</head>
<body>
  <div class="flag"></div>
  <main class="wrap">
    <div class="hero"><h1>Admin</h1><p class="sub">Approve photos and videos before they go on the big screen.</p></div>
    {% if not configured %}
      <div class="error">Admin is off: set ADMIN_EMAILS (and SUPABASE_URL for Google sign-in) and restart.</div>
    {% else %}
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <a class="btn" href="{{ url_for('login_google', for='admin') }}">Continue with Google</a>
    {% endif %}
  </main>
</body>
</html>
